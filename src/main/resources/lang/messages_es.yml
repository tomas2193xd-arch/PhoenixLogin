    question: "&6&l⚡ &e¿Eres un jugador &6&lPREMIUM &e(Mojang)?"
    option-premium: "  &a▸ &fEscribe &a/premium &fpara auto-login vía Mojang"
    option-cracked: "  &c▸ &fEscribe &c/cracked &fpara usar contraseña"
    footer: "&8&m                                          "

  verifying: "&eVerificando tu cuenta de Mojang..."
  api-error: "&cNo se pudo contactar con los servidores de Mojang. Usa &f/login &cen su lugar."
  not-premium: "&cTu nombre no es una cuenta premium de Mojang. Usa &f/login &co &f/register&c."
  offline-mode: "&cTu sesión no pudo ser verificada (modo offline)."
  use-login: "&7Usa &f/login <contraseña> &7para autenticarte."
  uuid-mismatch: "&cTu sesión no coincide con esta cuenta de Mojang."
  session-unverified: "&cSesión premium expirada o no verificada. Inicia sesión con contraseña."

  login-success: "&a&l✓ &a¡Login premium verificado! Bienvenido, &f{player}&a."
  auto-login-success: "&a&l✓ &a¡Auto-login premium! Bienvenido de vuelta, &f{player}&a."

