name: PhoenixLogin
version: "2.0.0"
main: dev.tomle.phoenixlogin.PhoenixLogin
api-version: "1.19"
author: Tomas2193
description: Advanced authentication plugin with sessions, captcha, anti-bot, and premium Mojang support.
softdepend: [NoteBlockAPI]

commands:
  login:
    description: Log in to the server
    usage: /login <password>
    aliases: [l]
  register:
    description: Create an account
    usage: /register <password> <confirm>
    aliases: [reg]
  captcha:
    description: Submit captcha code
    usage: /captcha <code>
  changepassword:
    description: Change your password
    usage: /changepassword <old> <new>
  unregister:
    description: Delete your account
    usage: /unregister <password>
  phoenixlogin:
    description: Admin commands
    usage: /phoenixlogin <reload|info|unregister|stats>
    aliases: [plogin, pl]
  setspawn:
    description: Set the login spawn location
    usage: /setspawn
  loginhistory:
    description: View login history
    usage: /loginhistory [player]
    aliases: [lhist]
  premium:
    description: Login as a premium (Mojang) player or toggle premium auto-login
    usage: /premium
    aliases: [prem]
  cracked:
    description: Select cracked mode (password login)
    usage: /cracked

permissions:
  phoenixlogin.admin:
    description: Access to admin commands
    default: op
  phoenixlogin.setspawn:
    description: Set the login spawn
    default: op
  phoenixlogin.bypass:
    description: Bypass authentication
    default: false
  phoenixlogin.history:
    description: View own login history
    default: true
  phoenixlogin.history.others:
    description: View other player login history
    default: op
  phoenixlogin.premium:
    description: Use premium auto-login
    default: true
